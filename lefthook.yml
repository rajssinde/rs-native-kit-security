pre-commit:
  parallel: true
  commands:

    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}

    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
pre-push:
  parallel: true
  commands:

    unit:
      run: yarn test --maxWorkers=2

    scripts:
      run: node --test scripts/*.test.mjs

    server:
      root: server/
      run: node --test test/*.test.mts
