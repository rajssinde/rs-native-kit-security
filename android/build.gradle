buildscript {
  ext.Security = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Security[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Nitro's generated bindings are tied to the react-native-nitro-modules runtime: this
// package ships one tree per compatible range (see ../nitro-compat.json) and picks the
// one matching the app's installed runtime.
def nitroRuntimeVersion() {
  File pkg = null
  def nitroProject = rootProject.findProject(":react-native-nitro-modules")
  if (nitroProject != null) {
    pkg = new File(nitroProject.projectDir, "../package.json")
  }
  if (pkg == null || !pkg.exists()) {
    try {
      def proc = ["node", "-p", "require.resolve('react-native-nitro-modules/package.json')"].execute(null, projectDir)
      def out = proc.text.trim()
      proc.waitFor()
      if (proc.exitValue() == 0) pkg = new File(out)
    } catch (Exception ignored) {
      // node unavailable; handled below
    }
  }
  return (pkg != null && pkg.exists()) ? new groovy.json.JsonSlurper().parse(pkg).version : null
}

def versionTuple(String version) {
  def match = (version =~ /^(\d+)\.(\d+)\.(\d+)/)
  return match.find() ? [match.group(1) as int, match.group(2) as int, match.group(3) as int] : null
}

def compareVersions(a, b) {
  for (int i = 0; i < 3; i++) {
    if (a[i] != b[i]) return a[i] <=> b[i]
  }
  return 0
}

def nitroCompat = new groovy.json.JsonSlurper().parse(file("../nitro-compat.json"))
def nitroVersion = nitroRuntimeVersion()
def nitroTuple = nitroVersion != null ? versionTuple(nitroVersion) : null
def nitrogenDir = "generated"
if (nitroTuple == null) {
  logger.warn("[@rs-native-kit/security] Could not determine the react-native-nitro-modules version; assuming >= ${nitroCompat.modernFrom}.")
} else if (compareVersions(nitroTuple, versionTuple(nitroCompat.minimum)) < 0) {
  throw new GradleException(
    "[@rs-native-kit/security] react-native-nitro-modules ${nitroVersion} is not supported; " +
      "install ${nitroCompat.minimum} or newer."
  )
} else {
  if (compareVersions(nitroTuple, versionTuple(nitroCompat.modernFrom)) < 0) {
    nitrogenDir = "generated-legacy"
  }
  if (compareVersions(nitroTuple, versionTuple(nitroCompat.newestTested)) > 0) {
    logger.warn("[@rs-native-kit/security] react-native-nitro-modules ${nitroVersion} is newer than the newest tested version (${nitroCompat.newestTested}).")
  }
}
logger.info("[@rs-native-kit/security] react-native-nitro-modules ${nitroVersion} -> nitrogen/${nitrogenDir}")

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: "../nitrogen/${nitrogenDir}/android/rsnativekit_security+autolinking.gradle"

apply plugin: "com.facebook.react"

// This is a Nitro module: no TurboModule specs to codegen. Without a jsRootDir the
// React Native plugin scans this repo's node_modules/react-native and compiles all
// of RN core's specs into the library, which then collide with the app's copies
// (duplicate com.facebook.fbreact.specs.* classes in release builds).
react {
  jsRootDir = file("../src")
}

android {
  namespace "com.margelo.nitro.rsnativekit.security"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON", "-DRS_NITROGEN_DIR=${nitrogenDir}"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
    // IntegrityChecker reads BuildConfig.DEBUG to tell debug from release builds.
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "com.google.android.play:integrity:1.6.0"

  testImplementation "junit:junit:4.13.2"
}
